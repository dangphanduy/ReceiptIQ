[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "receiptiq"
version = "0.1.0"
description = "Receipt OCR and key-field extraction research baseline (SROIE)."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "paddlepaddle>=3.0,<4",   # CPU build
    "paddleocr>=3.0,<4",      # brings opencv-contrib-python via paddlex; do not add another opencv wheel
    "pillow>=10",
    "datasets>=3",
    "huggingface_hub>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.12"]

[tool.setuptools]
packages = ["app", "ml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "scripts"]  # scripts/ for standalone script helpers (eda_sroie.shape)

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
